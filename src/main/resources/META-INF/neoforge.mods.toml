modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/cambrova/long-standing-bug-fixes/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "cambrova"
${logo_key} = "assets/long_standing_fixes/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Fixes for confirmed bugs that have stayed open for years: comparators read campfires, baby villagers take the iron golem's poppy, burning skeletons shoot burning arrows, wind charges push dropped items. Each can be turned off.'''

[[mixins]]
config = "long_standing_fixes.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
