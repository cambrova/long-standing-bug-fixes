modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/mojira-fix-pack/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx"
${logo_key} = "assets/mojira_fix_pack/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Fixes for confirmed, still-open bugs from Mojang's bug tracker: comparators read campfires (MC-166272), baby villagers take the iron golem's poppy (MC-159069). Each can be turned off.'''

[[mixins]]
config = "mojira_fix_pack.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
